name: Publicar tienda

on:
  push:
    branches: [main]
    paths: ["metadata/**", "scripts/**", ".github/workflows/publish.yml"]
  workflow_dispatch:
  repository_dispatch:
    types: [app-released]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pyyaml requests

      - name: Añadir Android build-tools (aapt2, apksigner) al PATH
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          echo "Usando $BT"
          echo "$BT" >> "$GITHUB_PATH"

      - name: Generar índice
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          REPO_NAME: Mi Tienda
        run: python scripts/generate_index.py

      - name: Comprobar que se generó el índice
        run: |
          pwd
          ls -la repo || true
          test -s repo/index-v1.json || { echo "::error::repo/index-v1.json no existe; revisa el log de 'Generar índice'"; exit 1; }
          head -c 600 repo/index-v1.json; echo

      - name: Firmar índice
        env:
          KEY: ${{ secrets.REPO_SIGNING_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::El secret REPO_SIGNING_KEY no existe o está vacío (debe ser un Repository secret)"
            exit 1
          fi
          printf '%s\n' "$KEY" > /tmp/key.pem
          if ! head -n1 /tmp/key.pem | grep -q "BEGIN EC PRIVATE KEY\|BEGIN PRIVATE KEY"; then
            echo "::error::El secret no parece una clave privada PEM (falta la línea -----BEGIN ...-----)"
            exit 1
          fi
          openssl dgst -sha256 -sign /tmp/key.pem -out /tmp/sig.bin repo/index-v1.json
          base64 -w0 /tmp/sig.bin > repo/index-v1.json.sig
          openssl ec -in /tmp/key.pem -pubout -out /tmp/pub.pem
          openssl dgst -sha256 -verify /tmp/pub.pem -signature /tmp/sig.bin repo/index-v1.json
          rm -f /tmp/key.pem /tmp/pub.pem /tmp/sig.bin

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: repo

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
